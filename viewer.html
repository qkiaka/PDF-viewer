<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>URLビューア</title>
<style>
  html, body { margin: 0; height: 100%; font-family: sans-serif; }
  body { display: flex; flex-direction: column; }
  form { display: flex; gap: 4px; padding: 6px; border-bottom: 1px solid #ccc; }
  input { flex: 1; padding: 6px; font-size: 14px; }
  button { padding: 6px 14px; font-size: 14px; }
  #msg { padding: 6px; color: #b00; font-size: 13px; display: none; }
  #view { flex: 1; border: 0; width: 100%; background: #fff; }
  img#img { max-width: 100%; margin: auto; display: none; }
</style>
</head>
<body>
<form id="form">
  <input id="url" type="url" placeholder="PDFや画像のURLを貼り付け" required autofocus>
  <button>開く</button>
</form>
<div id="msg"></div>
<iframe id="view"></iframe>
<img id="img" alt="">
<script src="viewer.js"></script>
</body>
</html>
